name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ':excimer'
          coverage: pcov
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer ci
      - name: Collect coverage when source contains executable statements
        id: coverage
        run: |
          vendor/bin/phpunit --coverage-clover build/coverage/clover.xml
          if grep -Eq 'statements="[1-9][0-9]*"' build/coverage/clover.xml; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: codecov/codecov-action@v7
        if: steps.coverage.outputs.upload == 'true'
        with:
          files: build/coverage/clover.xml
          use_oidc: true
          fail_ci_if_error: true

  compatibility:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        exclude:
          - php: '8.2'
            laravel: '13'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ':excimer'
          coverage: none
          tools: composer:v2
      - run: composer require --no-interaction --no-progress --prefer-dist "laravel/framework:^${{ matrix.laravel }}.0"
      - run: composer test
